name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    name: Test, build & release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare android/ scaffold + signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x tool/*.sh
          ./tool/ci_prepare_android.sh

      - name: Pub get
        run: flutter pub get

      - name: Analyze (blocking)
        run: flutter analyze

      - name: Test (blocking)
        run: flutter test

      - name: Read version from pubspec
        id: version
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)"
          BUILD="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 2)"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION (code $BUILD)"

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "app-release-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact (verification)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-v${{ steps.version.outputs.name }}
          path: app-release-v${{ steps.version.outputs.name }}.apk
          retention-days: 30

      # ---- Tag pushes additionally build an AAB and publish a Release ----
      - name: Build release AAB (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build appbundle --release

      - name: Rename AAB artifact
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mv build/app/outputs/bundle/release/app-release.aab \
             "app-release-v${{ steps.version.outputs.name }}.aab"

      - name: Create GitHub Release with signed APK + AAB
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app-release-v${{ steps.version.outputs.name }}.apk
            app-release-v${{ steps.version.outputs.name }}.aab
